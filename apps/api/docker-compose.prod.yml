# Production stack for the VPS. This server also hosts another project, so
# everything here is explicitly namespaced (project name, container names,
# network, volumes, host port) to avoid colliding with it.
#
# MongoDB (Atlas) and file storage (Cloudflare R2) are external managed
# services configured entirely through apps/api/.env — nothing for them runs
# here. Redis and Qdrant stay self-hosted since they're simple single-container
# services with no replica-set/cluster setup.
#
# The other project (notedrill-*) already owns host ports 80/443/5000 via its
# own nginx container, which reverse-proxies to containers by Docker DNS name
# on its "notedrill_notedrill-network" network — not via host ports. So this
# api container joins that same external network too, reachable there as
# "clinicalfact-api:5000". The 127.0.0.1:5001 host mapping below is just for
# local debugging (curl from the VPS itself); nginx never uses it.
#
# IMPORTANT: the service key below (and every service key in this file) must
# never be named "api" (or anything else notedrill's own docker-compose.yml
# uses as a service name). Compose auto-registers a network alias equal to
# the *service name* on every network a service joins, including external
# ones — a service here named "api" collides with notedrill's own "api"
# service on the shared network, and Docker's DNS round-robins between the
# two containers for anyone resolving "api", silently misrouting requests
# between the two live apps. Learned this the hard way — see git history.
# The explicit `aliases:` below is a second layer of defense against this,
# so this container is only ever reachable on the shared network by the one
# name nginx actually references, regardless of how either project's service
# names evolve.

name: clinicalfact

services:
  clinicalfact-api:
    image: ghcr.io/pixelgumstudio/clinical-fact-api:latest
    container_name: clinicalfact-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # google-credentials.json is gitignored/dockerignored (it's a secret
      # service-account key), so it can't be baked into the image - mount it
      # from the host instead. Place the file at
      # ${DEPLOY_PATH}/apps/api/google-credentials.json on the server; this
      # path must match GOOGLE_APPLICATION_CREDENTIALS in .env.
      - ./google-credentials.json:/app/apps/api/google-credentials.json:ro
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      - redis
      - qdrant
    networks:
      clinicalfact-network: {}
      notedrill_notedrill-network:
        aliases:
          - clinicalfact-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: clinicalfact-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - clinicalfact-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinicalfact-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - clinicalfact-network

volumes:
  redis-data:
  qdrant-storage:

networks:
  clinicalfact-network:
    driver: bridge
  notedrill_notedrill-network:
    external: true
