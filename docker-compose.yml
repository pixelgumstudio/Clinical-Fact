version: '3.8'

services:
  # Redis - Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: clinicfact-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=7818569dcd8ccdd3665f2e31c914a4cb5c0e64226a3f7cc48d8a1627007438db
    command: redis-server --requirepass 7818569dcd8ccdd3665f2e31c914a4cb5c0e64226a3f7cc48d8a1627007438db
    volumes:
      - redis-data:/data
    networks:
      - clinicfact-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO - S3-like Object Storage
  minio:
    image: minio/minio:latest
    container_name: clinicfact-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: e17dd8b8d1c8e7fc808e0c93c76c03de85add89782c48535daddb2e27e8cceea
    volumes:
      - minio-data:/minio_data
    networks:
      - clinicfact-network
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinicfact-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - clinicfact-network
    environment:
      QDRANT_API_KEY: your-qdrant-api-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MongoDB - Local instance
  mongodb:
    image: mongo:7
    container_name: clinicfact-mongodb-local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: clinicfact123secure
      MONGO_INITDB_DATABASE: clinicfact
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - clinicfact-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  minio-data:
  qdrant-storage:
  mongodb-data:
  mongodb-config:

networks:
  clinicfact-network:
    driver: bridge
