version: '3.8'

services:
  # Redis - Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: clinicalfact-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=7818569dcd8ccdd3665f2e31c914a4cb5c0e64226a3f7cc48d8a1627007438db
    command: redis-server --requirepass 7818569dcd8ccdd3665f2e31c914a4cb5c0e64226a3f7cc48d8a1627007438db
    volumes:
      - redis-data:/data
    networks:
      - clinicalfact-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO - S3-like Object Storage
  minio:
    image: minio/minio:latest
    container_name: clinicalfact-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: e17dd8b8d1c8e7fc808e0c93c76c03de85add89782c48535daddb2e27e8cceea
    volumes:
      - minio-data:/minio_data
    networks:
      - clinicalfact-network
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinicalfact-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - clinicalfact-network
    environment:
      QDRANT_API_KEY: your-qdrant-api-key
    healthcheck:
      # qdrant/qdrant:latest no longer ships curl/wget; use bash's /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MongoDB - Local instance
  mongodb:
    image: mongo:7
    container_name: clinicalfact-mongodb-local
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: clinicfact123secure
      MONGO_INITDB_DATABASE: clinicfact
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - clinicalfact-network
    # Single-node replica set: required for Change Streams (used by the job-status SSE
    # endpoint that every AI generation flow — chat, notes, quizzes, flashcards — polls).
    # A plain standalone mongod cannot open a change stream at all. The keyfile lives inside
    # the mongodb-config named volume (generated once via `docker exec`), not bind-mounted
    # from the host, to avoid Windows bind-mount permission issues (mongod requires 400 perms).
    command: mongod --replSet rs0 --keyFile /data/configdb/mongo-keyfile --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  minio-data:
  qdrant-storage:
  mongodb-data:
  mongodb-config:

networks:
  clinicalfact-network:
    driver: bridge
